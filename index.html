<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EverydayCalc</title></head>
<body style="font-family:Arial;text-align:center;padding:30px">
<h1 style="color:#4285f4">EverydayCalc is LIVE!</h1>
<h2>Age Calculator</h2>
<input type="date" id="dob" onchange="calc()"><p id="res"></p>
<script>
function calc(){
let d=new Date(document.getElementById('dob').value);
let n=new Date();
let y=n.getFullYear()-d.getFullYear();
document.getElementById('res').innerHTML="Age: "+y+" Years";
}
</script>
<p>Full version coming soon - If you see this, GitHub Pages is working!</p>
</body></html>
