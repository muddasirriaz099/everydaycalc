<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMI Calculator - Calculate Body Mass Index | EverydayCalc</title>
<meta name="description" content="Free BMI calculator to check your body mass index, healthy weight range.">
<link rel="canonical" href="https://muddasirriaz099.github.io/everydaycalc/bmi-calculator.html">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#f6f7fb;color:#111;line-height:1.6}
.container{max-width:700px;margin:0 auto;padding:16px}
.header{background:#fff;padding:14px 16px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.06);display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.header a{color:#2563eb;text-decoration:none;font-weight:600}
.card{background:#fff;padding:20px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.07)}
h1{font-size:22px;margin-bottom:8px}
.sub{color:#666;margin-bottom:18px;font-size:14px}
label{display:block;font-weight:600;margin:12px 0 6px;font-size:14px}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{width:100%;margin-top:18px;background:#16a34a;color:#fff;border:0;padding:14px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}
.result{margin-top:18px;padding:16px;background:#ecfdf5;border-radius:12px;display:none}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <a href="./index.html">← Back to Home</a>
    <a href="./index.html">EverydayCalc</a>
  </div>
  <div class="card">
    <h1>BMI Calculator</h1>
    <p class="sub">Check if your weight is healthy for your height.</p>
    <div class="row">
      <div>
        <label>Height (cm)</label>
        <input type="number" id="height" value="170" placeholder="e.g. 170">
      </div>
      <div>
        <label>Weight (kg)</label>
        <input type="number" id="weight" value="70" placeholder="e.g. 70">
      </div>
    </div>
    <button class="btn" onclick="calcBMI()">Calculate BMI</button>
    <div class="result" id="resultBox">
      <h3 id="bmiValue"></h3>
      <div id="bmiCat"></div>
      <div id="bmiRange" style="margin-top:8px;font-size:13px;color:#555"></div>
    </div>
  </div>
</div>
<script>
function calcBMI(){
  const h = parseFloat(document.getElementById('height').value);
  const w = parseFloat(document.getElementById('weight').value);
  if(!h || !w){ alert('Enter height and weight'); return; }
  const hm = h/100;
  const bmi = (w/(hm*hm)).toFixed(1);
  let cat="", color="";
  if(bmi<18.5){cat="Underweight"; color="#f59e0b";}
  else if(bmi<25){cat="Normal - Healthy!"; color="#16a34a";}
  else if(bmi<30){cat="Overweight"; color="#f59e0b";}
  else{cat="Obese"; color="#dc2626";}
  const box=document.getElementById('resultBox');
  box.style.display='block';
  document.getElementById('bmiValue').innerHTML=`Your BMI: ${bmi}`;
  document.getElementById('bmiValue').style.color=color;
  document.getElementById('bmiCat').innerHTML=`<b>Category:</b> ${cat}`;
  document.getElementById('bmiRange').innerHTML=`Healthy BMI range: 18.5 - 24.9`;
  box.scrollIntoView({behavior:'smooth'});
}
</script>
</body>
  </html>
