<body>
<a href="/">← Back</a>
<h1>Paycheck Calculator USA 2026</h1>
<div class="calc-box">
<label>Hourly Rate $</label><input type="number" id="rate" value="25">
<label>Hours per Week</label><input type="number" id="hours" value="40">
<label>Federal Tax %</label><input type="number" id="fed" value="12">
<label>State Tax %</label><input type="number" id="state" value="5">
<button onclick="calcPay()">Calculate Take-Home</button>
<div id="res" class="result" style="display:none"></div>
<div id="sol" class="solution" style="display:none"></div>
</div>
<h2>How to Use</h2><ul><li>Enter hourly rate</li><li>Enter weekly hours</li><li>Enter tax % and calculate</li></ul>
<h2>Advantage / Disadvantage</h2><table class="adv-table"><tr><td><b>Advantage</b><br>Real take-home idea, yearly/monthly view</td><td><b>Disadvantage</b><br>Each state different, exact may vary</td></tr></table>
<script>
function calcPay(){
let r=parseFloat(document.getElementById('rate').value);let h=parseFloat(document.getElementById('hours').value);
let f=parseFloat(document.getElementById('fed').value);let s=parseFloat(document.getElementById('state').value);
let gross=r*h*52;let fica=7.65;let totalTax=f+s+fica;let take=gross*(1-totalTax/100);
document.getElementById('res').style.display='block';document.getElementById('res').innerHTML=`Yearly Gross: $${gross.toFixed(0)} | Take-Home: $${take.toFixed(0)} | Monthly: $${(take/12).toFixed(0)}`;
document.getElementById('sol').style.display='block';document.getElementById('sol').innerHTML=`<b>Solution:</b> $${r} x ${h}h x 52 weeks = $${gross}. Minus Taxes (${f}% Fed + ${s}% State + 7.65% FICA) = Take-Home $${take.toFixed(0)}/year`;
}
</script>
</body>
