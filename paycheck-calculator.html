<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paycheck Calculator - Take Home Pay | EverydayCalc</title>
<meta name="description" content="Free paycheck calculator to calculate net pay, taxes, take home salary.">
<link rel="canonical" href="https://muddasirriaz099.github.io/everydaycalc/paycheck-calculator.html">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#f6f7fb;color:#111;line-height:1.6}
.container{max-width:700px;margin:0 auto;padding:16px}
.header{background:#fff;padding:14px 16px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.06);display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.header a{color:#2563eb;text-decoration:none;font-weight:600}
.card{background:#fff;padding:20px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.07)}
h1{font-size:22px;margin-bottom:8px}
.sub{color:#666;margin-bottom:18px;font-size:14px}
label{display:block;font-weight:600;margin:12px 0 6px;font-size:14px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px}
.btn{width:100%;margin-top:18px;background:#7c3aed;color:#fff;border:0;padding:14px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}
.result{margin-top:18px;padding:16px;background:#f5f3ff;border-radius:12px;display:none}
.result div{margin:6px 0}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <a href="./index.html">← Back to Home</a>
    <a href="./index.html">EverydayCalc</a>
  </div>
  <div class="card">
    <h1>Paycheck Calculator</h1>
    <p class="sub">Calculate your take-home pay after taxes.</p>
    <label>Gross Pay ($)</label>
    <input type="number" id="gross" value="3000" placeholder="e.g. 3000">
    <label>Tax Rate (%)</label>
    <input type="number" id="tax" value="15" placeholder="e.g. 15">
    <label>Other Deductions ($)</label>
    <input type="number" id="deduct" value="0" placeholder="e.g. 100">
    <button class="btn" onclick="calcPay()">Calculate Paycheck</button>
    <div class="result" id="resultBox">
      <div id="netPay" style="font-size:18px;font-weight:800"></div>
      <div id="taxAmt"></div>
      <div id="monthlyYearly" style="font-size:13px;color:#555;margin-top:8px"></div>
    </div>
  </div>
</div>
<script>
function calcPay(){
  const gross=parseFloat(document.getElementById('gross').value)||0;
  const tax=parseFloat(document.getElementById('tax').value)||0;
  const deduct=parseFloat(document.getElementById('deduct').value)||0;
  if(!gross){ alert('Enter gross pay'); return; }
  const taxAmt = gross * tax / 100;
  const net = gross - taxAmt - deduct;
  const box=document.getElementById('resultBox');
  box.style.display='block';
  document.getElementById('netPay').innerHTML=`Take Home Pay: $${net.toFixed(2)}`;
  document.getElementById('taxAmt').innerHTML=`Tax: $${taxAmt.toFixed(2)} | Deductions: $${deduct.toFixed(2)}`;
  document.getElementById('monthlyYearly').innerHTML=`Yearly Net (12 months): $${(net*12).toFixed(2)}`;
  box.scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
